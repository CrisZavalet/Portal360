

<div class="bg-slate-100 dark:bg-slate-700 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">

    
<div class="p-6 ">

  <div
    class="rounded-xl bg-white dark:bg-slate-800 shadow-sm border border-slate-200 dark:border-slate-700 p-6">

    <div>
        <div>
    <h2 class="text-2xl font-semibold text-slate-700 dark:text-white mb-6">
      Lista de empleados
    </h2>

</div>
<div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">

  <button
    type="button"
    (click)="volver()"
    class="rounded-md bg-indigo-600 px-4 py-2 text-white hover:bg-indigo-500">
    Volver
  </button>

  <input
    type="text"
    placeholder="Buscar empleado..."
    [(ngModel)]="busqueda"
    (input)="filtrar()"
    class="w-full md:w-80 border border-slate-300 dark:border-slate-600 rounded-lg px-4 py-2 bg-white dark:bg-slate-900 dark:text-white">

</div>

    <div class="hidden md:block overflow-x-auto">
        <div class="max-h-[60vh] overflow-y-auto overflow-x-auto">
      <table class="min-w-full">

        <thead
          class="bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-200">

          <tr>

            <th class="px-6 py-3 text-left">Empleado</th>

          </tr>

        </thead>

        <tbody>
            @for (empleado of empleadosPaginados; track $index) {
          <tr
            class="border-b border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700">

            <td class="px-6 py-4">
                <button (click)="verHistorial(empleado.idEmployee)">
                {{ empleado.name }} {{ empleado.lastName }}</button>
          </td> 

          </tr>
        }
        </tbody>

      </table>

      <div class="mt-6 flex items-center justify-between">

    <button
        (click)="paginaAnterior()"
        [disabled]="paginaActual === 1"
        class="px-4 py-2 rounded-lg border disabled:opacity-40">

        Anterior

    </button>

    <span class="text-sm">

        Página {{ paginaActual }} de {{ totalPaginas }}

    </span>

    <button
        (click)="paginaSiguiente()"
        [disabled]="paginaActual === totalPaginas"
        class="px-4 py-2 rounded-lg border disabled:opacity-40">

        Siguiente

    </button>

</div>

    </div>

  </div>

</div>

<div class="md:hidden space-y-2 md:hidden max-h-[70vh] overflow-y-auto space-y-4">

    @for(empleado of empleadosPaginados; track $index) {  
 <div
  class="rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm p-3">

  <div class="flex justify-between items-center mb-2">

    <h3 class="font-semibold text-slate-800 dark:text-white">
       <button (click)="verHistorial(empleado.idEmployee)">
                {{ empleado.name }} {{ empleado.lastName }}</button>
    </h3>

   

  </div>


</div>
}

</div>
</div>
</div>
