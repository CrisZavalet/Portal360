<section class="flex min-h-[calc(100vh-4rem)] items-center justify-center px-6">
  <div class="w-full max-w-md rounded-2xl bg-white p-10 text-center shadow-lg">

    <h1 class="text-8xl font-extrabold text-indigo-600 dark:text-indigo-400">
      404
    </h1>

    <h2 class="mt-4 text-2xl font-semibold text-gray-900">
      Página no encontrada
    </h2>

    <p class="mt-3 text-gray-600">
      Lo sentimos, la página que intentas visitar no existe o ha sido movida.
    </p>

    <div class="mt-8 flex justify-center gap-4">

      <button
        (click)="goBack()"
        class="rounded-lg border border-gray-300 px-5 py-2.5 font-medium text-gray-700 transition hover:bg-gray-100">
        Volver atrás
      </button>

      <button
        (click)="goHome()"
        class="rounded-lg bg-indigo-600 px-5 py-2.5 font-medium text-white transition hover:bg-indigo-700">
        Ir al inicio
      </button>

    </div>

  </div>
</section>
